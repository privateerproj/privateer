header:
  schema-version: 2.2.0
  last-updated: "2026-10-12"
  last-reviewed: "2026-10-01"
  url: https://github.com/privateerproj/pvtr/blob/main/.github/security-insights.yml
  project-si-source: https://raw.githubusercontent.com/privateerproj/.github/refs/heads/main/.github/security-insights.yml
  comment: |
    This file contains only the repository information for the core Privateer CLI.

repository:
  url: https://github.com/privateerproj/pvtr
  status: active
  bug-fixes-only: false
  accepts-change-request: true
  accepts-automated-change-request: true
  no-third-party-packages: false
  core-team:
    - name: Eddie Knight
      affiliation: Sonatype
      social: https://bsky.app/profile/eddieknight.dev
      primary: true
    - name: Jason Meridth
      affiliation: Revanite
      social: https://github.com/jmeridth
      primary: false
  documentation:
    contributing-guide: https://github.com/privateerproj/pvtr/blob/main/CONTRIBUTING.md
    security-policy: https://github.com/privateerproj/.github/blob/main/.github/SECURITY.md
  license:
    url: https://github.com/privateerproj/pvtr?tab=Apache-2.0-1-ov-file#readme
    expression: Apache-2.0
  release:
    changelog: https://github.com/privateerproj/pvtr/releases
    automated-pipeline: true
    distribution-points:
      - uri: https://github.com/privateerproj/pvtr/releases
        comment: GitHub Release Page
  security:
    assessments:
      self:
        evidence: https://github.com/privateerproj/pvtr/blob/main/.github/threat-assessment.yaml
        date: "2026-02-28"
        comment: |
          Gemara v1.5.0 threat catalog for the Privateer CLI, written by the Privateer Maintainer Group.
          Threats live in .github/threat-assessment.yaml and reference the capabilities in .github/capability-catalog.yaml.
      third-party:
        - name: OpenSSF Best Practices OSPS Baseline
          evidence: https://www.bestpractices.dev/projects/15145/baseline-1
          date: "2026-10-01"
          comment: OSPS Baseline Level 1 (criteria v2026.08.28), self-reported on bestpractices.dev with autodetected answers.
    champions:
      - name: Jason Meridth
        primary: true
    tools:
      - name: Dependabot
        type: SCA
        version: "2"
        rulesets:
          - default
        results:
          adhoc:
            name: Scheduled SCA Scan Results
            predicate-uri: https://docs.github.com/en/graphql/reference/objects#repositoryvulnerabilityalert
            location: https://github.com/privateerproj/pvtr/blob/main/.github/dependabot.yml
            comment: |
              Dependabot is configured in .github/dependabot.yml. Its alerts are visible to maintainers in the repository's Security tab.
        integration:
          adhoc: true
          ci: false
          release: false
      - name: GitHub Secret Scanning
        type: secret
        rulesets:
          - default
        comment: |
          GitHub secret scanning and push protection are enabled in the
          repository's security settings (OSPS-BR-07.01). Alerts are visible
          to maintainers only.
        integration:
          adhoc: false
          ci: true
          release: false
      - name: OSPS Baseline Scanner
        type: other
        rulesets:
          - osps-baseline-2026-08
        integration:
          adhoc: false
          ci: true
          release: false
        results:
          ci:
            name: OSPS Baseline evaluation
            predicate-uri: https://github.com/revanite-io/osps-baseline-action
            location: https://github.com/privateerproj/pvtr/actions/workflows/osps-security-assessment.yaml
      - name: OSPS Baseline Scanner (grc.store)
        type: other
        rulesets:
          - osps-baseline-2026-08
        integration:
          adhoc: false
          ci: true
          release: false
        results:
          ci:
            name: OSPS Baseline evaluation published to grc.store
            predicate-uri: https://github.com/revanite-io/pvtr-publish-results
            location: https://grc.store/targets/privateer/pvtr
