---
name: "Publish OSPS Baseline results to grc.store"

# Scans this repository against the OSPS Baseline with the openssf/github-repo
# plugin and publishes the signed EvaluationLog to grc.store, where it shows
# up on the target page for privateer/pvtr.
#
# Weekly and on demand, never per push or pull request: every published run is
# a permanent coordinate, and the hub stores one log per target and catalog
# every ten minutes and rejects the rest with rate_limited.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run the scan but publish nothing (bundles land in the pvtr-bundles artifact)"
        type: boolean
        default: true
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    permissions:
      contents: read # Read the latest release tag
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: latest release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  results:
    name: results
    needs: version
    permissions:
      contents: read # The scanner reads this repository through the job token
      id-token: write # Trusted publishing to the hub and the Sigstore signing identity
      # The called workflow's report job requests it, and GitHub checks every
      # called job at startup, even one that upload-sarif: false skips.
      security-events: write
    # Pinned by tag, not SHA, on purpose: the hub compares the signing
    # certificate's workflow ref to this exact tag and rejects a SHA-pinned
    # call. The default hub (https://hub.grc.store) trusts v1, an immutable
    # release.
    uses: revanite-io/pvtr-publish-results/.github/workflows/publish.yml@v1 # zizmor: ignore[unpinned-uses] the hub requires the tag
    with:
      target: privateer/pvtr@${{ needs.version.outputs.version }}
      license: CC0-1.0
      # A scheduled run has no inputs; it publishes.
      dry-run: ${{ inputs.dry-run == true }}
    secrets:
      # Inline because the plugin's token can only come from its config vars.
      # The job token is read-only and scoped to this repository, so settings
      # the scanner can't read (admin, org MFA) report "needs review".
      # revanite-io/pvtr-publish-results#10 tracks octo-sts support.
      config: |
        targets:
          pvtr:
            plugin: openssf/github-repo
            policy:
              catalogs:
                - osps-baseline
              applicability:
                - maturity-1
            vars:
              owner: privateerproj
              repo: pvtr
              token: ${{ secrets.GITHUB_TOKEN }}
