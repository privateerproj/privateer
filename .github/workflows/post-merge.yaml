---
name: Post merge to main

on:
  push:
    branches: [main]

permissions: {}

jobs:
  first_test_job:
    name: Find extra commits
    runs-on: ubuntu-latest
    permissions:
      contents: write # BYOB badge action updates the version badge
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: Fetch_tags
        run: git fetch --prune --unshallow --tags
      - run: git describe --tags
      - id: set_output_tags
        run: |
          echo "extra_commits=$(git describe --tags)" >> "$GITHUB_OUTPUT"
      - name: Set Badge
        uses: RubbaBoy/BYOB@24f464284c1fd32028524b59607d417a2e36fee7 # v1.3.0
        with:
          name: Version
          label: "Version"
          status: ${{ steps.set_output_tags.outputs.extra_commits }}
          color: CFC03A
          github_token: ${{ secrets.GITHUB_TOKEN }}
