---
name: "Auto Labeler"
on:
  # pull_request_target event is required for autolabeler to support all PRs including forks
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions: {}

concurrency:
  # PR number is unique per pull request, avoiding cross-PR group collisions that
  # author-controlled head_ref can cause when two PRs share a source branch name.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  auto_labeler:
    permissions:
      contents: read         # Read repository contents for the reusable workflow
      pull-requests: write   # Apply labels to the pull request
    uses: github-community-projects/ospo-reusable-workflows/.github/workflows/auto-labeler.yaml@13d124b245cf85ba41d9dd58d6888979043f1a29
    with:
      config-name: release-drafter.yml
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
