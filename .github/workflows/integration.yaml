---
name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read # Clone the repository and diff changed files
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            # On push to main, always run
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            # On PR, check if any non-markdown files changed
            FILES=$(git diff --name-only "origin/$BASE_REF...HEAD" | grep -v '\.md$' || true)
            if [ -z "$FILES" ]; then
              echo "code=false" >> "$GITHUB_OUTPUT"
            else
              echo "code=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  integration:
    name: Integration Tests
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Clone the repository
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: make -B build

      - name: ossf/pvtr-github-repo-scanner Plugin Integration Test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          ./test/integration_test.sh 2>&1 | tee integration_output.txt

      - name: Verify integration test output
        if: always()
        run: |
          echo "=== Integration test output ==="
          cat integration_output.txt
          echo "=== Verifying expected summary line ==="
          grep -E 'privateer_osps-baseline-.*Passed.*Warnings.*Failed.*Possible' integration_output.txt || {
            echo "ERROR: Expected summary line not found in integration test output"
            exit 1
          }
