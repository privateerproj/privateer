---
name: "Release"
on:
  workflow_dispatch:
  pull_request_target:
    types: [closed]
    branches: [main]

# No concurrency block: releases must never be cancelled mid-run, and the
# pull_request_target: closed trigger fires at most once per merged PR.
permissions: {}

jobs:
  release:
    permissions:
      contents: write       # create_release, publish_release: tag + release
      pull-requests: read   # create_release: read PR labels for release-drafter
      id-token: write       # release_goreleaser, release_image: attestation OIDC
      attestations: write   # release_goreleaser, release_image: build provenance
      packages: write       # release_image: push container image (gated, but validated)
      discussions: write    # release_discussion: announcement (gated, defensive)
    uses: github-community-projects/ospo-reusable-workflows/.github/workflows/release.yaml@5193129233b450e9174d4d92fcc467919a989882 # v1.2.2
    with:
      publish: true
      release-config-name: release-drafter.yml
      goreleaser-config-path: .goreleaser.yaml
      go-version-file: go.mod
      create-attestation: true
      release-only-with-label: true
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
  update-homebrew:
    needs: release
    if: ${{ needs.release.outputs.full-tag && needs.release.outputs.full-tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read     # Required by harden-runner
      id-token: write    # Federate via octo-sts for cross-repo push
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Download archives and compute checksums
        id: checksums
        env:
          TAG: ${{ needs.release.outputs.full-tag }}
        run: |
          BASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/${TAG}"
          curl -fSL "$BASE_URL/pvtr_Darwin_all.tar.gz" -o darwin.tar.gz
          curl -fSL "$BASE_URL/pvtr_Linux_x86_64.tar.gz" -o linux_amd64.tar.gz
          curl -fSL "$BASE_URL/pvtr_Linux_arm64.tar.gz" -o linux_arm64.tar.gz
          {
            echo "darwin_sha256=$(sha256sum darwin.tar.gz | awk '{print $1}')"
            echo "linux_amd64_sha256=$(sha256sum linux_amd64.tar.gz | awk '{print $1}')"
            echo "linux_arm64_sha256=$(sha256sum linux_arm64.tar.gz | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05
        id: octo-sts
        with:
          scope: privateerproj/homebrew-tap
          identity: privateer
      - name: Checkout homebrew-tap
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: privateerproj/homebrew-tap
          token: ${{ steps.octo-sts.outputs.token }}
          persist-credentials: true # Required for git push of the formula update
      - name: Update homebrew formula
        env:
          TAG: ${{ needs.release.outputs.full-tag }}
          DARWIN_SHA: ${{ steps.checksums.outputs.darwin_sha256 }}
          LINUX_AMD64_SHA: ${{ steps.checksums.outputs.linux_amd64_sha256 }}
          LINUX_ARM64_SHA: ${{ steps.checksums.outputs.linux_arm64_sha256 }}
        run: |
          # Point the formula at this tag's assets. The archive prefix is rewritten
          # alongside the tag so the formula tracks GoReleaser's project_name; both
          # substitutions are idempotent once the formula is already current.
          sed -i "s|releases/download/v[^/]*/|releases/download/${TAG}/|g" pvtr.rb
          sed -i "s|/privateer_|/pvtr_|g" pvtr.rb

          # Update SHA256 checksums in order: Darwin, Linux x86_64, Linux arm64
          awk -v d="$DARWIN_SHA" -v x="$LINUX_AMD64_SHA" -v a="$LINUX_ARM64_SHA" '
            /sha256/ && !s1 { sub(/sha256 "[^"]*"/, "sha256 \"" d "\""); s1=1; print; next }
            /sha256/ && !s2 { sub(/sha256 "[^"]*"/, "sha256 \"" x "\""); s2=1; print; next }
            /sha256/ && !s3 { sub(/sha256 "[^"]*"/, "sha256 \"" a "\""); s3=1; print; next }
            { print }' pvtr.rb > pvtr.rb.tmp && mv pvtr.rb.tmp pvtr.rb

          # Skip commit if formula is unchanged (e.g., workflow rerun for same tag)
          if git diff --quiet pvtr.rb; then
            echo "Formula is already up to date, skipping commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pvtr.rb
          git commit -m "Brew formula update for pvtr version ${TAG}"
          git push
