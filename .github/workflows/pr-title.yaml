## Reference: https://github.com/amannn/action-semantic-pull-request
---
name: "Lint PR Title"
on:
  # pull_request, not pull_request_target: the check only reads the title, so the
  # read-only token fork pull requests get is enough (OSPS-BR-01.03).
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions: {}

concurrency:
  # PR number is unique per pull request, avoiding cross-PR group collisions that
  # author-controlled head_ref can cause when two PRs share a source branch name.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint_pr_title:
    permissions:
      contents: read        # Read repository contents for the reusable workflow
      pull-requests: read   # Read the pull request title to validate it
      statuses: write       # Required by the reusable workflow's job; capped to read on fork PRs
    uses: github-community-projects/ospo-reusable-workflows/.github/workflows/pr-title.yaml@3e055d5fc59e62419fb3103d96fd116ddcf89c8c # v2.3.0
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
